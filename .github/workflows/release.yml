name: Release

# Al subir una etiqueta v* (p. ej. v1.0.1) compila el DMG y lo adjunta a un Release de GitHub.
# Si el Release ya existe (publicado a mano con su DMG), no hace nada.
# Ejecución manual (Actions > Release > Run workflow): compila el DMG y lo deja como artefacto, sin publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Ya existe el Release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar DMG (firma ad hoc)
        if: steps.check.outputs.exists != 'true'
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) V="0.0.0-test" ;; esac
          VERSION="$V" SIGN_IDENTITY=- ./build.sh --dmg
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --generate-notes
      - name: Guardar el DMG como artefacto (ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: M999Battery-dmg
          path: build/*.dmg
