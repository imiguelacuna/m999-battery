name: Release

# Al subir una etiqueta v* (p. ej. v1.0.1) compila el DMG y lo adjunta a un Release de GitHub.
# Si el Release ya existe (publicado a mano con su DMG), no hace nada.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: ¿Ya existe el Release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar DMG (firma ad hoc)
        if: steps.check.outputs.exists != 'true'
        run: VERSION="${GITHUB_REF_NAME#v}" SIGN_IDENTITY=- ./build.sh --dmg
      - name: Publicar Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --generate-notes
